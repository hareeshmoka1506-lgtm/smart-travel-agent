<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>TravelAI - Agentic Travel Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand-container">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">TravelAI</h1>
          <p class="brand-tagline">✈️🧳🏝️</p>
        </div>
        <button class="icon-btn close-sidebar" id="close-sidebar" aria-label="Close menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="section-label">RECENT TRIPS</div>
        <div class="capability-list" id="recent-trips-list">
          <div class="capability-item" onclick="loadTrip('tokyo')">
            <span class="cap-dot"></span>
            <div class="cap-text">
              <span class="cap-title">Tokyo Plan</span>
              <span class="cap-desc">4 Days Journey</span>
            </div>
          </div>
          <div class="capability-item" onclick="loadTrip('paris')">
            <span class="cap-dot"></span>
            <div class="cap-text">
              <span class="cap-title">Paris Budget</span>
              <span class="cap-desc">Budget Friendly</span>
            </div>
          </div>
          <div class="capability-item" onclick="loadTrip('dubai')">
            <span class="cap-dot"></span>
            <div class="cap-text">
              <span class="cap-title">Dubai Weekend</span>
              <span class="cap-desc">Luxury Stay</span>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="action-btn" onclick="clearConversation()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
          <span>+ New Trip</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-nav">
        <div class="nav-left">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="connection-status">
            <span class="status-indicator-dot"></span>
            <span class="status-text">Travel Assistant</span>
          </div>
        </div>
        <div class="nav-actions">
          <button class="action-btn compact" onclick="clearConversation()" aria-label="New itinerary">New</button>
          <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <div id="messages-container" class="messages-container">
        <div class="hero-card" id="welcome-card">
          <div class="hero-badge">AI Travel Planner</div>
          <img src="/static/images/imagestravel-hero.png"
              class="hero-image"
               alt="Travel Hero">
          <h2 class="hero-title">Plan Your Next Adventure ✈️</h2>
          <p class="hero-subtitle">Tell me where you want to go and I'll create a perfect travel plan for you.</p>
          
          <div class="cards-grid">
            <button type="button" class="prompt-card" onclick="applySuggestion('Plan a 4-day trip to Tokyo with live weather forecast, top sights, and estimated budget for 2 people.')">
              <div class="card-header">
                <span class="card-tag">Full Plan</span>
              </div>
              <h3 class="card-title">⛩️ Japan Adventure</h3>
              <p class="card-desc">Explore temples, food, and city life.</p>
            </button>

            <button type="button" class="prompt-card" onclick="applySuggestion('Give me a 3-day budget itinerary for Paris with current weather and estimated accommodation costs.')">
              <div class="card-header">
                <span class="card-tag">Budget Guide</span>
              </div>
              <h3 class="card-title">🗼Paris Getaway</h3>
              <p class="card-desc">Discover iconic landmarks and culture.</p>
            </button>

            <button type="button" class="prompt-card" onclick="applySuggestion('Create a luxury weekend itinerary for Dubai including weather forecast and exclusive attractions.')">
              <div class="card-header">
                <span class="card-tag">Luxury Stay</span>
              </div>
              <h3 class="card-title">🌴 Dubai Experience</h3>
              <p class="card-desc">Luxury attractions and desert adventures.</p>
            </button>
          </div>
        </div>
      </div>
         
         <div class="try-asking">
           <button onclick="applySuggestion('Plan My Dream Vacation')">
           ✨ Plan My Dream Vacation
            </button>

            <button onclick="applySuggestion('Solo Trip Under ₹30,000')">
             ✨ Solo Trip Under ₹30,000
             </button>

            <button onclick="applySuggestion('Family Vacation Planner')">
            ✨ Family Vacation Planner
            </button>
          </div>

      <div class="chat-input-wrapper">
        <form id="chat-form" class="chat-form" onsubmit="handleSend(event)">
          <textarea
            id="user-input"
            placeholder="Ask me about any destination, itinerary, budget..."
            rows="1"
            onkeydown="handleKeyDown(event)"
          ></textarea>
          <button type="submit" id="send-btn" class="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
